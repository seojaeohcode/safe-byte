services:
  caddy:
    image: caddy:2-alpine
    environment:
      SAFEBYTE_DOMAIN: ${SAFEBYTE_DOMAIN:?Set your DNS hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
